# Builds and publishes a release.
#
# ## Why this exists rather than a hand-made release
#
# Three of the remaining distribution items — installers, code signing, and the
# auto-updater finding anything — are not code problems. They are "somebody has
# to run the build on three operating systems, sign the output with keys that
# must not be on a laptop, and publish the result somewhere stable". That is
# what this file is.
#
# ## What it needs that this repository does not contain
#
# Secrets, and they are secrets for a reason. Each is listed here with what
# happens without it, because a workflow that fails with "invalid signature" and
# no explanation is worse than one that says which key is missing.
#
# - `TAURI_SIGNING_PRIVATE_KEY` — from `pnpm tauri signer generate`. The public
#   half is in `tauri.conf.json`; the private half goes here and nowhere else.
#   **Required**, because `bundle.createUpdaterArtifacts` is on: the build
#   produces signed updater bundles and fails outright without the key rather
#   than shipping updates nothing can verify. The `guard` job below checks for
#   it first so the failure is one clear sentence instead of a Rust build that
#   dies twenty minutes in on three runners at once.
# - `TAURI_SIGNING_PRIVATE_KEY_PASSWORD` — the passphrase for the above. Set it
#   to an empty secret if the key was generated without one.
# - `APPLE_CERTIFICATE`, `APPLE_CERTIFICATE_PASSWORD`, `APPLE_SIGNING_IDENTITY`,
#   `APPLE_ID`, `APPLE_PASSWORD`, `APPLE_TEAM_ID` — an Apple Developer
#   membership. Without them the macOS build still produces a `.dmg`, and
#   Gatekeeper refuses to open it on any machine but the one that built it.
# - `WINDOWS_CERTIFICATE`, `WINDOWS_CERTIFICATE_PASSWORD` — an Authenticode
#   certificate. Without it Windows SmartScreen warns on first run.
#
# Only the first two stop the build. The rest change how the output is received
# on the far side, and their absence is recorded in the release notes rather
# than hidden.

name: Release

on:
  push:
    tags:
      - 'v*'
  # Deliberately available by hand as well: a release that can only be made by
  # pushing a tag is a release nobody can test the pipeline for.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, without the leading v'
        required: true

permissions:
  contents: read

jobs:
  # Everything that can be known before a compiler starts, established once.
  #
  # Three runners spend the better part of an hour between them, and every
  # reason this workflow can fail early — a missing signing key, notes that
  # cannot be read — is knowable in seconds. Finding out first is the whole
  # job.
  guard:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - uses: actions/checkout@v5

      - name: Check the signing key is present
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set. The build produces signed updater bundles and cannot run without it. Generate a key with 'pnpm tauri signer generate' and add the private half as a repository secret; the public half belongs in src-tauri/tauri.conf.json."
            exit 1
          fi
          echo "signing key present"

      - name: Work out the version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

          # Anything below 1.0, or carrying a suffix, goes out marked as a
          # pre-release. The project describes itself as pre-alpha, and a
          # release page that does not say so invites people to treat it as
          # finished.
          case "$version" in
            0.*|*-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      # `tauri-action`'s `releaseBody` is the body itself, not a path to one.
      # Passing it a filename put the literal string
      # "/home/runner/work/MadMusic/MadMusic/CHANGELOG.md" on the release page,
      # which is why the notes are read here and passed as text.
      - name: Read the release notes
        id: notes
        run: |
          # The section for this exact version, so a changelog that has moved
          # on to the next one still describes the tag being built rather than
          # whatever is at the top of the file.
          notes=$(awk -v want="## [${{ steps.version.outputs.version }}]" '
            index($0, want) == 1 { seen = 1; next }
            seen && /^## / { exit }
            seen { print }
          ' CHANGELOG.md)

          if [ -z "$(echo "$notes" | tr -d '[:space:]')" ]; then
            echo "::error::CHANGELOG.md has no '## [${{ steps.version.outputs.version }}]' section with anything in it. A release describes what changed; add the section before tagging."
            exit 1
          fi

          {
            echo "notes<<CHANGELOG_EOF"
            echo "$notes"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: guard

    permissions:
      contents: write

    strategy:
      # One platform failing must not cancel the others. A macOS runner that
      # ran out of disk should not cost a perfectly good Windows installer.
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
            # Both, because a universal build compiles each architecture
            # separately and lipos the results — so the build script looks for
            # a sidecar named after each arch, never for "universal".
            extractor: '--target universal-apple-darwin'
            rust-targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
            extractor: '--target x86_64-unknown-linux-gnu'
            rust-targets: ''
          - platform: 'windows-latest'
            args: ''
            extractor: '--target x86_64-pc-windows-msvc'
            rust-targets: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v5

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev \
            libdbus-1-dev

      # No `version:` here on purpose. `package.json` pins the version with
      # `packageManager`, and naming a second one made this action refuse to
      # install anything at all — which is what failed every run of these
      # workflows before the first release was ever attempted.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'pnpm'

      - uses: dtolnay/rust-toolchain@stable
        with:
          # The universal macOS binary needs both, and `--target` alone does not
          # install them.
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: pnpm install --frozen-lockfile

      # The sidecar is not in the repository — it is fetched against a pinned
      # checksum. Without this step the build produces an app that stops after
      # about a minute on many catalogue tracks.
      - name: Fetch the extractor
        shell: bash
        run: pnpm extractor ${{ matrix.extractor }}

      # The gates, before anything is published. A release that fails its own
      # test suite is a release nobody should be able to make by accident.
      # `shell: bash` matters here rather than being a style choice: PowerShell
      # is the default on the Windows runner and only propagates the *last*
      # command's exit code, so a failing `pnpm typecheck` three lines up would
      # have been reported as a passing gate.
      - name: Check
        shell: bash
        run: |
          pnpm typecheck
          pnpm lint
          pnpm test
          pnpm attributions --check

      - name: Check Rust
        working-directory: src-tauri
        shell: bash
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

      # Everything the *product* needs, as opposed to everything the signing
      # and notarising needs.
      #
      # This block was missing, and its absence was silent by design — which is
      # what made it worth a comment rather than a one-line fix. Every one of
      # these keys is optional on purpose: `auth-config.ts` leaves sign-in out
      # when there is no Clerk key, `convex-client.ts` reports no backend when
      # there is no URL, and the Rust side reads the rest through `option_env!`
      # so a build without them compiles and simply does not offer the feature.
      #
      # That is the right behaviour for somebody building the project
      # themselves. It is the wrong behaviour for the official release, and
      # because each one degrades quietly the result was a shipped binary with
      # **no sign-in, no cross-device sync, no scrobbling, no Discogs credits,
      # no AcoustID and no Discord presence** — and nothing anywhere saying so.
      #
      # Unset secrets expand to the empty string, so this is safe to have here
      # before the secrets exist: the build behaves exactly as it does today
      # until one is added, and starts offering the feature the moment it is.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

          # Read by Vite at build time and compiled into the bundle. Both are
          # public by design: the publishable key identifies a Clerk instance
          # and the deployment URL identifies a Convex deployment, and every
          # function behind the latter checks the caller's token before it does
          # anything. The Clerk *secret* key belongs on the Convex deployment
          # and nowhere near this file — `auth-config.ts` throws on boot if one
          # ever reaches the bundle.
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_CONVEX_URL: ${{ secrets.VITE_CONVEX_URL }}
          # Where the web build lives, so the desktop app can offer to sign in
          # through the browser. Without it that button is not drawn at all.
          VITE_WEB_ORIGIN: ${{ secrets.VITE_WEB_ORIGIN }}

          # Read by Rust at compile time, through `option_env!`. Deliberately
          # not VITE_-prefixed: Last.fm signs authenticated calls with a shared
          # secret, and anything with that prefix is readable from the
          # devtools console. In a desktop binary it can still be extracted by
          # anyone determined — that is true of every desktop scrobbler, and
          # why Last.fm issues keys per application rather than per user.
          MADMUSIC_LASTFM_KEY: ${{ secrets.MADMUSIC_LASTFM_KEY }}
          MADMUSIC_LASTFM_SECRET: ${{ secrets.MADMUSIC_LASTFM_SECRET }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
          ACOUSTID_API_KEY: ${{ secrets.ACOUSTID_API_KEY }}
          DISCORD_APP_ID: ${{ secrets.DISCORD_APP_ID }}

          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: v${{ needs.guard.outputs.version }}
          releaseName: 'MadMusic v${{ needs.guard.outputs.version }}'
          # The text itself, read from the changelog by the `guard` job, so the
          # notes somebody reads in the app and the notes on the release page
          # are one text.
          releaseBody: ${{ needs.guard.outputs.notes }}
          releaseDraft: true
          prerelease: ${{ needs.guard.outputs.prerelease }}
          # This is what the updater reads. Without it the endpoint in
          # `tauri.conf.json` resolves to nothing and the app correctly reports
          # that it is up to date forever.
          includeUpdaterJson: true
          args: ${{ matrix.args }}

  # The package-manager manifests, once there is a release to point them at.
  #
  # Separate from the build because it needs every platform's artefacts, and
  # because submitting them is a manual step in all three ecosystems — see
  # `scripts/packaging.mjs` for what each one requires.
  manifests:
    needs: [guard, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # The release the build job just made is a draft, and `gh release
      # download` reads drafts happily with the repository token.
      - name: Download the release artefacts
        run: |
          mkdir -p bundle
          gh release download "v${{ needs.guard.outputs.version }}" \
            --repo "$GITHUB_REPOSITORY" --dir bundle --pattern '*'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate the manifests
        run: >-
          node scripts/packaging.mjs
          --version "${{ needs.guard.outputs.version }}"
          --dir bundle

      - uses: actions/upload-artifact@v4
        with:
          name: packaging-manifests
          path: packaging/
